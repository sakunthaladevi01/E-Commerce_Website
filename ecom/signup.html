<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARSJ Shop | Signup</title>
    <link rel="icon" type="image/svg+xml" href="image/logo-k-icon.svg">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
<form action="login.html">
<h1>Signup</h1><br>
    <input type="text" name="username" placeholder="Username" required><br><br>
    <input type="text" name="firstname" placeholder="First Name" required><br><br>
    <input type="text" name="lastname" placeholder="Last Name"><br><br>
    <input type="text" name="email" placeholder="Your Email"><br><br>

    <div class="password-field">
    <input type="password" id="password" class="password-input" placeholder="Password" required>
    <span class="toggle-password" onclick="togglePassword('password', 'eyeIcon1')">
        <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
        </svg>
    </span>
    </div><br><br>

    <div class="password-field">
    <input type="password" id="repassword" class="password-input" placeholder="Re-Enter-Password" required>
    <span class="toggle-password" onclick="togglePassword('repassword', 'eyeIcon2')">
        <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
        </svg>
    </span>
    </div>
    <br><br><br>
    <button type="submit">Signup</button>

</form>
    <script src="main.js"></script>
</body>
</html>
